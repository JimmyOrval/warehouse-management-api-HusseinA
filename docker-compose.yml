services:
  api:
    image: jimmyorval/warehouse-api:latest
    container_name: warehouse-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__Redis: "redis:6379"
      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__Exchange: "warehouse.events"
      RabbitMQ__Username: "${RABBITMQ_USER}"
      RabbitMQ__Password: "${RABBITMQ_PASSWORD}"
      MinIO__Endpoint: "minio:9000"
      MinIO__AccessKey: "${MINIO_USER}"
      MinIO__SecretKey: "${MINIO_PASSWORD}"
      MinIO__BucketName: "warehouse-assets"
      MinIO__UseSsl: "false"
      Firebase__ProjectId: "${FIREBASE_PROJECT_ID}"
      Firebase__WebApiKey: "${FIREBASE_API_KEY}"
      FirebaseServiceAccountPath: "/app/secrets/firebase-service-account.json"
      HealthChecksUI__HealthChecks__0__Name: "Warehouse API"
      HealthChecksUI__HealthChecks__0__Uri: "http://localhost:8080/health"
    volumes:
      - "${FIREBASE_CREDENTIALS_HOST_PATH}:/app/secrets/firebase-service-account.json:ro"
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - minio
    networks:
      - db-network
      - cache-network
      - messaging-network
      - storage-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:18
    container_name: warehouse-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - db-network

  redis:
    image: redis:7.4-alpine
    container_name: warehouse-redis
    networks:
      - cache-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: warehouse-rabbitmq
    ports:
      - "15672:15672" # only for UI
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - messaging-network

  minio:
    image: minio/minio:latest
    container_name: warehouse-minio
    ports:
      - "9001:9001" # only for UI
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - storage-network

networks:
  db-network:
  cache-network:
  messaging-network:
  storage-network:

volumes:
  postgres-data:
  minio-data:
  rabbitmq-data:
